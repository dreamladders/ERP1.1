<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Accounts - Dream Ladders ERP</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 24px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  margin-top: 6px;
  color: #6b7280;
}

/* BUTTON */

button {
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 600;
}

.primary {
  background: #111827;
  color: white;
}

.danger {
  background: #dc2626;
  color: white;
}

/* SUMMARY */

.summary {
  display: grid;
  grid-template-columns:
    repeat(4, 1fr);

  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.05);
}

.card-title {
  font-size: 14px;
  color: #6b7280;
}

.card-value {
  font-size: 26px;
  font-weight: bold;
  margin-top: 8px;
}

.income {
  color: #15803d;
}

.expense {
  color: #dc2626;
}

.balance {
  color: #2563eb;
}

/* TOOLBAR */

.toolbar {
  background: white;
  padding: 16px;
  border-radius: 14px;

  display: flex;
  gap: 12px;
  flex-wrap: wrap;

  margin-bottom: 16px;
}

input,
select {

  padding: 11px;

  border: 1px solid #d1d5db;

  border-radius: 8px;

  background: white;

  min-width: 160px;
}

/* TABLE */

.table-container {
  background: white;
  border-radius: 14px;
  overflow-x: auto;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.05);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 14px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  white-space: nowrap;
}

th {
  background: #f9fafb;
  font-size: 13px;
}

.badge {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge-income {
  background: #dcfce7;
  color: #166534;
}

.badge-expense {
  background: #fee2e2;
  color: #991b1b;
}

/* MODAL */

.modal {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.5);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modal-box {

  background: white;

  width: 100%;
  max-width: 550px;

  border-radius: 16px;

  padding: 24px;

  max-height: 90vh;

  overflow-y: auto;
}

.modal-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {

  display: block;

  font-size: 13px;

  font-weight: 600;

  margin-bottom: 6px;
}

.form-group input,
.form-group select {

  width: 100%;
}

.form-actions {

  display: flex;

  justify-content: flex-end;

  gap: 10px;

  margin-top: 20px;
}

/* MOBILE */

@media(max-width: 800px) {

  .summary {
    grid-template-columns:
      repeat(2, 1fr);
  }

}

@media(max-width: 500px) {

  .container {
    padding: 14px;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>Accounts</h1>

      <p>
        Manage income, expenses and financial transactions
      </p>

    </div>

    <button
      class="primary"
      onclick="openTransactionModal()"
    >
      + Add Transaction
    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="card">

      <div class="card-title">
        Total Income
      </div>

      <div
        id="totalIncome"
        class="card-value income"
      >
        ₹0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Total Expenses
      </div>

      <div
        id="totalExpense"
        class="card-value expense"
      >
        ₹0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Balance
      </div>

      <div
        id="balance"
        class="card-value balance"
      >
        ₹0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Transactions
      </div>

      <div
        id="transactionCount"
        class="card-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- FILTER -->

  <div class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="Search..."
      oninput="loadTransactions()"
    >


    <select
      id="typeFilter"
      onchange="loadTransactions()"
    >

      <option value="">
        All Types
      </option>

      <option value="Income">
        Income
      </option>

      <option value="Expense">
        Expense
      </option>

    </select>


    <input
      id="fromDate"
      type="date"
      onchange="loadTransactions()"
    >


    <input
      id="toDate"
      type="date"
      onchange="loadTransactions()"
    >


    <button
      onclick="clearFilters()"
    >
      Clear
    </button>

  </div>


  <!-- TABLE -->

  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Date</th>
          <th>Type</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Payment</th>
          <th>Party</th>
          <th>Reference</th>
          <th>Action</th>

        </tr>

      </thead>

      <tbody id="transactionsBody">

      </tbody>

    </table>

  </div>

</div>


<!-- TRANSACTION MODAL -->

<div
  id="transactionModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        Add Transaction
      </h2>

      <button onclick="closeTransactionModal()">
        ✕
      </button>

    </div>


    <form
      id="transactionForm"
      onsubmit="submitTransaction(event)"
    >

      <div class="form-group">

        <label>
          Date
        </label>

        <input
          type="date"
          id="transactionDate"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Type
        </label>

        <select
          id="transactionType"
          required
        >

          <option value="">
            Select Type
          </option>

          <option value="Income">
            Income
          </option>

          <option value="Expense">
            Expense
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Category
        </label>

        <select
          id="transactionCategory"
          required
        >

          <option value="">
            Select Category
          </option>

          <option>
            Project Payment
          </option>

          <option>
            Salary
          </option>

          <option>
            Material
          </option>

          <option>
            Labour
          </option>

          <option>
            Transport
          </option>

          <option>
            Office Expense
          </option>

          <option>
            Equipment
          </option>

          <option>
            Software
          </option>

          <option>
            Other
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Description
        </label>

        <input
          type="text"
          id="description"
          placeholder="Transaction description"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Amount
        </label>

        <input
          type="number"
          id="amount"
          min="0.01"
          step="0.01"
          placeholder="₹ Amount"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Payment Mode
        </label>

        <select
          id="paymentMode"
        >

          <option value="Cash">
            Cash
          </option>

          <option value="Bank">
            Bank
          </option>

          <option value="UPI">
            UPI
          </option>

          <option value="Card">
            Card
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Party / Person
        </label>

        <input
          type="text"
          id="party"
          placeholder="Client / Supplier / Person"
        >

      </div>


      <div class="form-group">

        <label>
          Reference
        </label>

        <input
          type="text"
          id="reference"
          placeholder="Invoice / Bill / Reference"
        >

      </div>


      <div class="form-actions">

        <button
          type="button"
          onclick="closeTransactionModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary"
        >
          Save Transaction
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/*
 * IMPORTANT:
 *
 * Replace this URL with your existing
 * Google Apps Script Web App URL.
 */

const API_URL =
  'YOUR_APPS_SCRIPT_WEB_APP_URL';


/**
 * Call backend.
 */
async function api(action, data = {}) {

  const response = await fetch(API_URL, {

    method: 'POST',

    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },

    body: JSON.stringify({
      action: action,
      data: data
    })

  });

  const result = await response.json();

  if (!result.success && result.error) {
    throw new Error(result.error);
  }

  return result;
}


/**
 * Load dashboard.
 */
async function loadDashboard() {

  try {

    const filters = getFilters();

    const result =
      await api(
        'getAccountsSummary',
        filters
      );

    document.getElementById('totalIncome')
      .textContent =
      formatCurrency(result.totalIncome);

    document.getElementById('totalExpense')
      .textContent =
      formatCurrency(result.totalExpense);

    document.getElementById('balance')
      .textContent =
      formatCurrency(result.balance);

    document.getElementById('transactionCount')
      .textContent =
      result.transactionCount;

  }

  catch(error) {

    console.error(error);

    alert(
      'Unable to load Accounts summary.'
    );

  }

}


/**
 * Load transactions.
 */
async function loadTransactions() {

  try {

    const filters = getFilters();

    const result =
      await api(
        'getAccountTransactions',
        filters
      );

    renderTransactions(result);

    await loadDashboard();

  }

  catch(error) {

    console.error(error);

    document.getElementById(
      'transactionsBody'
    ).innerHTML =
      `<tr>
        <td colspan="10">
          Failed to load transactions.
        </td>
      </tr>`;

  }

}


/**
 * Get filters.
 */
function getFilters() {

  return {

    search:
      document.getElementById('search').value,

    type:
      document.getElementById('typeFilter').value,

    fromDate:
      document.getElementById('fromDate').value,

    toDate:
      document.getElementById('toDate').value

  };

}


/**
 * Render table.
 */
function renderTransactions(transactions) {

  const tbody =
    document.getElementById(
      'transactionsBody'
    );

  tbody.innerHTML = '';


  if (!transactions || transactions.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="10"
            style="text-align:center;padding:30px;">
          No transactions found.
        </td>
      </tr>
    `;

    return;
  }


  transactions.forEach(transaction => {

    const tr =
      document.createElement('tr');


    const badge =
      transaction.type === 'Income'
        ? 'badge-income'
        : 'badge-expense';


    tr.innerHTML = `

      <td>
        ${escapeHtml(transaction.id)}
      </td>

      <td>
        ${escapeHtml(transaction.date)}
      </td>

      <td>
        <span class="badge ${badge}">
          ${escapeHtml(transaction.type)}
        </span>
      </td>

      <td>
        ${escapeHtml(transaction.category)}
      </td>

      <td>
        ${escapeHtml(transaction.description)}
      </td>

      <td>
        ${formatCurrency(transaction.amount)}
      </td>

      <td>
        ${escapeHtml(transaction.paymentMode)}
      </td>

      <td>
        ${escapeHtml(transaction.party)}
      </td>

      <td>
        ${escapeHtml(transaction.reference)}
      </td>

      <td>

        <button
          class="danger"
          onclick="deleteTransaction('${transaction.id}')"
        >
          Delete
        </button>

      </td>

    `;

    tbody.appendChild(tr);

  });

}


/**
 * Submit transaction.
 */
async function submitTransaction(event) {

  event.preventDefault();


  const data = {

    date:
      document.getElementById(
        'transactionDate'
      ).value,

    type:
      document.getElementById(
        'transactionType'
      ).value,

    category:
      document.getElementById(
        'transactionCategory'
      ).value,

    description:
      document.getElementById(
        'description'
      ).value,

    amount:
      Number(
        document.getElementById(
          'amount'
        ).value
      ),

    paymentMode:
      document.getElementById(
        'paymentMode'
      ).value,

    party:
      document.getElementById(
        'party'
      ).value,

    reference:
      document.getElementById(
        'reference'
      ).value

  };


  try {

    const result =
      await api(
        'addAccountTransaction',
        data
      );


    alert(
      result.message ||
      'Transaction saved successfully.'
    );


    closeTransactionModal();

    document
      .getElementById(
        'transactionForm'
      )
      .reset();


    setToday();

    await loadTransactions();

  }

  catch(error) {

    alert(
      error.message ||
      'Failed to save transaction.'
    );

  }

}


/**
 * Delete transaction.
 */
async function deleteTransaction(id) {

  const confirmed =
    confirm(
      'Are you sure you want to delete this transaction?'
    );


  if (!confirmed) {
    return;
  }


  try {

    const result =
      await api(
        'deleteAccountTransaction',
        {
          id: id
        }
      );


    alert(
      result.message ||
      'Transaction deleted.'
    );


    await loadTransactions();

  }

  catch(error) {

    alert(
      error.message ||
      'Unable to delete transaction.'
    );

  }

}


/**
 * Open modal.
 */
function openTransactionModal() {

  document
    .getElementById(
      'transactionModal'
    )
    .style.display = 'flex';

  setToday();

}


/**
 * Close modal.
 */
function closeTransactionModal() {

  document
    .getElementById(
      'transactionModal'
    )
    .style.display = 'none';

}


/**
 * Set today's date.
 */
function setToday() {

  const input =
    document.getElementById(
      'transactionDate'
    );

  if (!input.value) {

    const today =
      new Date()
        .toISOString()
        .split('T')[0];

    input.value = today;

  }

}


/**
 * Clear filters.
 */
function clearFilters() {

  document.getElementById(
    'search'
  ).value = '';

  document.getElementById(
    'typeFilter'
  ).value = '';

  document.getElementById(
    'fromDate'
  ).value = '';

  document.getElementById(
    'toDate'
  ).value = '';

  loadTransactions();

}


/**
 * Currency formatting.
 */
function formatCurrency(value) {

  return new Intl.NumberFormat(
    'en-IN',
    {
      style: 'currency',
      currency: 'INR',
      maximumFractionDigits: 2
    }
  ).format(value || 0);

}


/**
 * Prevent HTML injection.
 */
function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return '';

  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/**
 * Initial load.
 */
document.addEventListener(
  'DOMContentLoaded',
  function() {

    setToday();

    loadTransactions();

  }
);

</script>

</body>

</html>
